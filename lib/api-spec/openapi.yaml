openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MemeFactory + ClipFactory API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: memes
    description: Meme generation operations
  - name: clips
    description: Clip creation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /memes/generate:
    post:
      operationId: generateMemes
      tags: [memes]
      summary: Generate memes from a YouTube video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemeGenerateInput"
      responses:
        "200":
          description: Memes generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemeGenerateResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /memes/ad-reward:
    post:
      operationId: claimAdReward
      tags: [memes]
      summary: Claim ad reward credits
      responses:
        "200":
          description: Ad reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdRewardResult"

  /memes/download-proxy:
    get:
      operationId: downloadProxy
      tags: [memes]
      summary: Proxy download for meme images
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  /clips/create:
    post:
      operationId: createClip
      tags: [clips]
      summary: Start clip creation job
      description: Starts async processing. Returns a job_id to poll for status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipCreateInput"
      responses:
        "200":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipJobStarted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /clips/status/{jobId}:
    get:
      operationId: getClipStatus
      tags: [clips]
      summary: Poll clip job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipJobStatus"

  /clips/download/{jobId}:
    get:
      operationId: downloadClip
      tags: [clips]
      summary: Download the finished clip video
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: MP4 video file
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  /clips/moments:
    post:
      operationId: getClipMoments
      tags: [clips]
      summary: Get AI-suggested best moments from a video (before full clip creation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipMomentsInput"
      responses:
        "200":
          description: Suggested moments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipMomentsResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MemeGenerateInput:
      type: object
      required: [youtube_url, language]
      properties:
        youtube_url:
          type: string
        language:
          type: string
          enum: [en, es]

    MemeItem:
      type: object
      required: [image_url, timestamp, what_happens, top_text, bottom_text, template_name]
      properties:
        image_url:
          type: string
        timestamp:
          type: string
        what_happens:
          type: string
        top_text:
          type: string
        bottom_text:
          type: string
        template_name:
          type: string

    MemeGenerateResult:
      type: object
      required: [memes, video_title]
      properties:
        memes:
          type: array
          items:
            $ref: "#/components/schemas/MemeItem"
        video_title:
          type: string

    AdRewardResult:
      type: object
      required: [ad_url, credits_granted]
      properties:
        ad_url:
          type: string
        credits_granted:
          type: integer

    ClipCreateInput:
      type: object
      required: [mood]
      properties:
        url:
          type: string
          description: YouTube/Twitch/Kick URL
        start:
          type: number
          description: Start time in seconds (manual mode)
        end:
          type: number
          description: End time in seconds (manual mode)
        mood:
          type: string
          enum: [energetic, chill, dramatic, funny]
        mode:
          type: string
          enum: [ai, manual]
          description: ai = let AI pick best moment, manual = user picks start/end

    ClipJobStarted:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
        message:
          type: string

    ClipJobStatus:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, processing, done, error]
        step:
          type: string
          description: Current processing step description
        progress:
          type: integer
          description: 0-100 progress percentage
        error:
          type: string
        download_url:
          type: string
          description: Set when status is done

    ClipMomentsInput:
      type: object
      required: [url]
      properties:
        url:
          type: string

    ClipMoment:
      type: object
      required: [start, end, reason]
      properties:
        start:
          type: number
        end:
          type: number
        reason:
          type: string

    ClipMomentsResult:
      type: object
      required: [moments, video_title]
      properties:
        moments:
          type: array
          items:
            $ref: "#/components/schemas/ClipMoment"
        video_title:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
