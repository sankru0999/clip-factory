kind = "web"
previewPath = "/"
title = "MemeFactory"
version = "1.0.0"
id = "artifacts/meme-factory"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20799

[services.development]
run = "pnpm --filter @workspace/meme-factory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meme-factory", "run", "build" ]
publicDir = "artifacts/meme-factory/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20799"
BASE_PATH = "/"
